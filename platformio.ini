[env:LGS_STM32G070CBT6]
platform = ststm32
board = nucleo_g070rb
board_build.mcu = stm32g070cbt6
board_build.f_cpu = 64000000L
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel
    olikraus/U8g2
    bodmer/TFT_eSPI
    arduino-libraries/Ethernet
    knolleary/PubSubClient
; ---------------------------------------------------------------------------
; TFT_eSPI config สำหรับจอ 3.5" ILI9488 + ทัช XPT2046 (บัส SPI1 ร่วมกัน)
; ใช้งานเมื่อ ENABLE_TFT_ILI9488_TEST = 1 ใน src/main.cpp
; ---------------------------------------------------------------------------
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    ; --- ขาบัส SPI ที่ใช้ร่วมกัน (จอ + ทัช) ---
    -D TFT_MOSI=PB5      ; TFT_MOSI / T_DIN
    -D TFT_SCLK=PA5      ; TFT_SCK / T_CLK
    -D TFT_MISO=PB4      ; จอไม่มี MISO แต่ทัช (T_DO) ใช้ขานี้อ่านค่า
    ; --- ขาควบคุมจอ ILI9488 ---
    -D TFT_CS=PB14
    -D TFT_DC=PC7        ; DC / RS
    -D TFT_RST=PC6       ; RESET
    -D TFT_BL=PB0        ; ไฟ backlight (LED)
    -D TFT_BACKLIGHT_ON=HIGH
    ; --- ขาทัช XPT2046 ---
    -D TOUCH_CS=PB15     ; T_CS
    ; --- ฟอนต์ที่โหลด ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; --- ความเร็ว SPI ---
    ; STM32G070 (PCLK 64MHz) prescaler ได้แค่ 32/16/8 MHz
    ; ขอ 40MHz เพื่อให้ปัดเป็นค่าจริง 32MHz (เดิม 27MHz ปัดลงเหลือ 16MHz)
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000